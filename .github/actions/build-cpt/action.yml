name: Build the cpt DuckDB extension
description: >
  Builds cpt (change point detection) from source at a pinned commit, cached
  per commit. cpt is not in a DuckDB extension repository yet.

outputs:
  extension-path:
    description: Absolute path of the built cpt.duckdb_extension
    value: ${{ github.workspace }}/duck-changepoint/build/release/cpt.duckdb_extension

runs:
  using: composite
  steps:
    - name: Check out cpt source
      uses: actions/checkout@v7
      with:
        repository: hugr-lab/duck-changepoint
        # Pinned; bump deliberately.
        ref: ffbc29e77b64df72be42492a5c9f03119e70d57d
        path: duck-changepoint
        submodules: recursive

    - name: Cache cpt build
      id: cache
      uses: actions/cache@v6
      with:
        path: duck-changepoint/build/release/cpt.duckdb_extension
        key: cpt-${{ runner.os }}-ffbc29e77b64df72be42492a5c9f03119e70d57d

    - name: Build cpt
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: duck-changepoint
      run: make configure && make release
