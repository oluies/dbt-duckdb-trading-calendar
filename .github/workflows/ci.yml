name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Match what .env.example shows — never a real credential, only used
  # for the throwaway SQL Server service started in this workflow.
  SA_PASSWORD: CI_Str0ng_P@ssword_2026!
  AZURE_CA_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  DBT_PROFILES_DIR: ${{ github.workspace }}

jobs:
  build:
    name: dbt build + test against SQL Server 2022
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write .env for docker compose + Make
        run: |
          cat > .env <<EOF
          SA_PASSWORD=${SA_PASSWORD}
          AZURE_CA_CERT_FILE=${AZURE_CA_CERT_FILE}
          EOF

      - name: Start SQL Server (docker compose)
        run: make db-up

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Referensdata database + azuredl schema
        run: make db-init

      - name: dbt deps
        run: dbt deps

      - name: dbt seed
        run: dbt seed

      - name: dbt run
        run: dbt run

      - name: dbt test
        run: dbt test

      # Change point example (models/changepoint/). cpt is not in a DuckDB
      # extension repo, so build it from source (.github/actions/build-cpt).
      - name: Build cpt extension
        id: cpt
        uses: ./.github/actions/build-cpt

      - name: dbt build (change point example)
        env:
          CPT_EXTENSION_PATH: ${{ steps.cpt.outputs.extension-path }}
        run: |
          dbt build --vars '{with_changepoint: true}' --select tag:changepoint

      - name: Dump SQL Server logs on failure
        if: failure()
        # One-shot (no -f). Previously this backgrounded `make db-logs`
        # which runs `docker compose logs -f` — the follow would be
        # killed before any output flushed, so the step printed nothing.
        run: docker compose logs mssql --no-color --tail 200

      - name: Tear down
        if: always()
        run: make db-down || true

  web:
    # The Scala.js + Laminar chart (web/) that pages.yml deploys. Builds
    # the same site on every PR so a break shows up before main. Needs no
    # SQL Server: the data is the committed web/public/fx_regimes.json.
    name: Scala.js site (web/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Mill and Coursier
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
          key: mill-${{ runner.os }}-${{ hashFiles('web/build.mill', 'web/mill') }}

      - name: Check colour contrast (WCAG 2.1 AA)
        run: python3 scripts/check_contrast.py

      - name: Link Scala.js and assemble the site
        working-directory: web
        run: make dist

      - name: Check the site's files
        working-directory: web/dist
        run: |
          for f in index.html main.js fx_regimes.json; do
            test -s "$f" || { echo "missing or empty: web/dist/$f"; exit 1; }
          done
          python3 -c "import json; d = json.load(open('fx_regimes.json')); assert d['days'] and d['regimes']"
